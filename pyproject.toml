[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskbot"
version = "1.0.0"
description = "Telegram task-manager bot with a FastAPI backend"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "s1lex312" }]
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "pyjwt>=2.8,<3.0",
    "httpx>=0.27,<1.0",
    "aiogram>=3.7,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "aiosqlite>=0.20,<1.0",
    "ruff>=0.4,<1.0",
    "black>=24.4",
    "isort>=5.13,<6.0",
    "pre-commit>=3.7,<4.0",
]

[tool.setuptools.packages.find]
include = ["api*", "bot*"]

# ---------------------------------------------------------------- lint/format
[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["api", "bot", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C90"]
ignore = ["S101"]  # asserts are fine in tests
mccabe = { max-complexity = 12 }

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S106"]
"alembic/versions/**" = ["E501"]

# --------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
